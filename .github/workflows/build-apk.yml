name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Diisi dari GitHub Secrets. Jika kosong, rilis tetap dibuild tetapi TIDAK ditandatangani.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      # Tanpa gradle-version: versi Gradle ditentukan HANYA oleh gradle/wrapper/gradle-wrapper.properties.
      - name: Siapkan Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Siapkan kunci penandatanganan rilis (opsional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Lint, tes unit, dan build debug + rilis
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --no-daemon

      - name: Verifikasi tanda tangan dan checksum rilis
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: Hapus material penandatanganan dari runner
        if: ${{ always() }}
        run: rm -f release.jks keystore.properties

      - name: Unggah laporan lint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agentapp-lint
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: agentapp-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Unggah APK rilis
        uses: actions/upload-artifact@v4
        with:
          name: agentapp-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
          if-no-files-found: ignore
